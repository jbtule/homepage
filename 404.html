<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting&hellip;</title>
<script>
  // Only these paths redirect to jbtule.github.io (where their Pages sites
  // actually live now); anything else here just 404s normally. Matching is
  // case-insensitive on the way in, but always redirects to the canonical
  // case below, since jbtule.github.io itself is case-sensitive.
  var redirects = [
    { match: "/fsharp.interop.compose", canonical: "/FSharp.Interop.Compose" }
  ];

  var path = location.pathname;
  var pathLower = path.toLowerCase();
  redirects.some(function (r) {
    if (pathLower === r.match || pathLower.indexOf(r.match + "/") === 0) {
      var rest = path.slice(r.match.length); // preserves case of anything after the prefix
      location.replace(
        "https://jbtule.github.io" + r.canonical + rest + location.search + location.hash
      );
      return true;
    }
    return false;
  });
</script>
</head>
<body>
  <p>Page not found.</p>
</body>
</html>
