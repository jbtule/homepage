<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not Found</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 36rem;
    margin: 15vh auto 0;
    padding: 0 1.25rem;
    text-align: center;
    color: #222;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #eee; background: #111; }
  }
  h1 {
    font-weight: 600;
    font-size: 1.5rem;
    margin: .25rem 0;
  }
  p { opacity: .7; }
  a { color: inherit; }
</style>
<script>
  // Only these paths redirect to jbtule.github.io (where their Pages sites
  // actually live now); anything else here just shows the 404 below.
  // Matching is case-insensitive on the way in, but always redirects to the
  // canonical case, since jbtule.github.io itself is case-sensitive.
  var redirects = [
    { match: "/fsharp.interop.compose", canonical: "/FSharp.Interop.Compose" }
  ];

  var path = location.pathname;
  var pathLower = path.toLowerCase();
  redirects.some(function (r) {
    if (pathLower === r.match || pathLower.indexOf(r.match + "/") === 0) {
      var rest = path.slice(r.match.length); // preserves case of anything after the prefix
      location.replace(
        "https://jbtule.github.io" + r.canonical + rest + location.search + location.hash
      );
      return true;
    }
    return false;
  });
</script>
</head>
<body>
  <h1>Page not found</h1>
  <p>There's nothing here.</p>
  <p><a href="/">Back to jay.tuley.name</a></p>
</body>
</html>
