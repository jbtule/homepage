<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting&hellip;</title>
<script>
  // Only these path prefixes redirect to jbtule.github.io (where their
  // Pages sites actually live now); anything else here just 404s normally.
  // Add more repo names to this list as needed.
  var redirectPrefixes = ["/FSharp.Interop.Compose"];

  var path = location.pathname;
  if (redirectPrefixes.some(function (p) { return path === p || path.indexOf(p + "/") === 0; })) {
    location.replace(
      "https://jbtule.github.io" + path + location.search + location.hash
    );
  }
</script>
</head>
<body>
  <p>Page not found.</p>
</body>
</html>
